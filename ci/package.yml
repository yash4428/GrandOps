package:image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  tags: [saas-linux-small-amd64]
  interruptible: true
  needs: []
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE/app:latest" || true
    - docker build --cache-from "$CI_REGISTRY_IMAGE/app:latest" --build-arg APP_VERSION="$CI_COMMIT_SHORT_SHA" -t "$IMAGE" .
    - docker push "$IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE/app:latest" && docker push "$CI_REGISTRY_IMAGE/app:latest"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["Dockerfile", "package.json", "pnpm-lock.yaml", "app/**/*", "components/**/*", "lib/**/*", "messages/**/*"]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# Mirror to Artifact Registry (Cloud Run deploy source).
package:image-gcp:
  extends: .gcp
  stage: package
  needs: [package:image]
  script:
    - gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
    - apt-get update -qq && apt-get install -y -qq skopeo >/dev/null
    - skopeo copy --src-creds "$CI_REGISTRY_USER:$CI_JOB_TOKEN" --dest-creds "oauth2accesstoken:$(gcloud auth print-access-token)" "docker://$IMAGE" "docker://$AR_IMAGE"
  rules:
    - !reference [.needs-gcp, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

package:sbom:
  stage: package
  image: { name: "anchore/syft:v1.33.0", entrypoint: [""] }
  tags: [saas-linux-small-amd64]
  needs: [package:image]
  variables:
    SYFT_REGISTRY_AUTH_AUTHORITY: $CI_REGISTRY
    SYFT_REGISTRY_AUTH_USERNAME: $CI_REGISTRY_USER
    SYFT_REGISTRY_AUTH_PASSWORD: $CI_JOB_TOKEN
  script:
    - /syft scan "registry:$IMAGE" -o cyclonedx-json=gl-sbom-app.cdx.json
  artifacts:
    paths: [gl-sbom-app.cdx.json]
    reports: { cyclonedx: gl-sbom-app.cdx.json }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# Reusable persona checks for other NGOs, published to the GitLab Package Registry on tags.
package:persona-kit:
  extends: .node
  stage: package
  needs: []
  script:
    - cd packages/persona-kit
    - npx -y typescript@5.9.3 -p tsconfig.json
    - npm version --no-git-tag-version "${CI_COMMIT_TAG#v}" || true
    - echo "@autopilot:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
