# Execution environment for CI-run Duo flows. Read ONLY from the default branch.
image: mcr.microsoft.com/playwright:v1.64.1-noble
setup_script:
  - corepack enable
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile --prefer-offline
cache:
  key:
    files: [pnpm-lock.yaml]
  paths: [.pnpm-store]
network_policy:
  allowed_domains:
    - registry.npmjs.org
    - fonts.googleapis.com
    - fonts.gstatic.com
    - gitlab.com
